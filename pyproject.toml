[tool.poetry]
name = "forbookmarks"
version = "0.1.0"
description = "A tool to process web browser bookmarks, similar to formail for mbox files."
authors = ["Your Name <you@example.com>"] # Placeholder, will be filled by user if necessary
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.0"
beautifulsoup4 = "^4.12" # Or latest stable
lxml = "^5.1" # Or latest stable

[tool.poetry.scripts]
forbookmarks = "forbookmarks.__main__:main"

[tool.poetry.group.dev.dependencies]
mypy = "^1.0" # Mypy 1.0+ supports Python 3.7+
pylint = "^2.17.0" # Pylint 2.17.x supports Python 3.7+
flake8 = "^6.0" # Flake8 6.0+ supports Python 3.8.1+
flake8-pyproject = "^1.1"
black = "^24.0"
pytest = "^7.4"
pytest-cov = "^4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 88
extend-ignore = "E203" # Ignore E203 (whitespace before ':') as it conflicts with black
per-file-ignores = [
    "tests/*.py:E501",
    "tests/**/*.py:E501"
]
